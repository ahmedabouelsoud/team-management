<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#172435;--mu:#748397;--ac:#08796e;--ac2:#e7f5f2;--bd:#e5ebef;--bad:#b94a44;--sh:0 4px 18px rgba(29,50,70,.045)}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:1240px;padding:22px 20px 34px}
.mast{margin-bottom:18px}
.mark{background:linear-gradient(145deg,#08796e,#0b9380);box-shadow:0 5px 13px #08796e25}
.mast h1{font-size:24px;letter-spacing:-.4px}
.sub{font-size:12px}
.save-state{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--mu);font-size:10px}
.save-dot{width:7px;height:7px;border-radius:50%;background:#30a078;box-shadow:0 0 0 3px #e8f5ef}
.save-state.error{color:var(--bad)}.save-state.error .save-dot{background:var(--bad);box-shadow:0 0 0 3px #fff0ef}
.card{border-radius:17px;padding:19px;border-color:#e5ebef;box-shadow:0 3px 14px rgba(31,52,72,.04)}
.weekcard{margin-bottom:15px}
.weekhead{margin-bottom:13px}
.weekhead h2,.sectionhead h2,.card h2{font-size:15px;color:var(--tx)}
.weeknav{gap:6px}
.weeknav button{font-size:11px;padding:8px 10px}
.weeknav input{width:142px;font-size:12px}
.days{gap:8px}
.day{min-height:72px;padding:10px 6px;border:1px solid transparent;border-radius:13px;transition:background .15s,border-color .15s,transform .15s}
.day:hover{transform:translateY(-1px);border-color:#c9e0d7}
.day strong{font-size:12px}
.day small{font-size:11px}
.day.on{background:var(--ac2);border-color:#62ad9a;color:#086b61;box-shadow:inset 0 0 0 1px #ffffffa8}
.day .count{display:block;font-size:9px;color:#08796e}
.board{grid-template-columns:minmax(0,1fr) 310px;gap:15px}
.maincol,.sidecol{gap:15px}
.sectionhead{margin-bottom:12px}
.sectionhead h2{margin-bottom:2px}
.add-activity{white-space:nowrap;font-weight:700;font-size:11px}
.day-progress-wrap{margin:-2px 0 8px}
.daymeta{gap:8px;font-size:11px}
.daymeta b{font-size:11px}
.day-progress-track{width:100px;height:6px;overflow:hidden;border-radius:10px;background:var(--ac2)}
.day-progress-track i{display:block;height:100%;border-radius:inherit;background:var(--ac);transition:width .2s}
.it{gap:10px;padding:13px 9px;border-bottom-color:#edf1f3;border-radius:10px}
.it:hover{background:#f8fbfa}
.it.cur{background:#eaf6f3}
.it input[type=checkbox]{width:20px;height:20px}
.tt{font-size:13px}
.s{font-size:11px}
.it .badge{font-size:9px}
button{border-radius:10px;font-size:12px;font-weight:650}
button.g{background:#edf6f3;color:#08796e}
button.g:hover{background:#e2f1ed}
input{border-color:#dfe7e9;border-radius:9px;background:#fff;font-size:12px}
.chip{padding:6px 10px;font-size:11px;border-radius:9px}
.chip.on{box-shadow:0 2px 8px color-mix(in srgb,var(--c) 20%,transparent)}
.fg{gap:10px}
.fg label{font-size:11px}
.fg input{margin-top:2px}
.repeat label{border:1px solid transparent;cursor:pointer}
.repeat label:has(input:checked){background:var(--ac2);color:var(--ac)}
.now{font-size:12px;background:var(--ac2);color:var(--tx)}
.summarytitle{margin-bottom:9px!important}
.sm{font-size:11px}
.emp{padding:28px 12px}
.emp strong{font-size:13px}
.emp button{margin-top:10px}
@media(max-width:780px){.wrap{padding:15px 13px 26px}.board{grid-template-columns:1fr}.sidecol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.days{gap:5px}.day{min-height:65px}.weekcard{padding:15px}.card{padding:16px}}
@media(max-width:560px){.wrap{padding:12px 10px calc(20px + env(safe-area-inset-bottom,0px))}.mast{align-items:flex-start}.mast h1{font-size:20px}.mark{width:39px;height:39px;border-radius:12px}.mast>.g{padding:8px 12px}.weekhead{gap:11px}.weeknav{display:grid;grid-template-columns:1fr auto 1fr;gap:5px}.weeknav button{padding:8px 6px;font-size:10px}.weeknav input{width:132px;padding:8px}.days{gap:3px}.day{min-height:61px;padding:7px 1px;border-radius:10px}.day strong{font-size:9px}.day small{font-size:9px;margin-top:3px}.day .count{font-size:8px}.day.today:after{inset-inline-start:4px;top:5px}.sidecol{display:flex}.agenda-card .sectionhead{align-items:center}.add-activity{padding:8px 9px;font-size:10px}.day-progress-track{width:70px}.it{gap:7px;padding:12px 5px}.it .badge{font-size:8px;padding:3px 5px}.it .ic{padding:5px;font-size:12px}.s{font-size:10px}.fg{grid-template-columns:1fr 1fr}.card{padding:14px;border-radius:14px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b19;--card:#1b2824;--tx:#e8f1ed;--mu:#9baca5;--ac:#55c5a1;--ac2:#243b33;--bd:#2c3b35;--bad:#f08181;--on:#11231d;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111b19;--card:#1b2824;--tx:#e8f1ed;--mu:#9baca5;--ac:#55c5a1;--ac2:#243b33;--bd:#2c3b35;--bad:#f08181;--on:#11231d;--sh:none;color-scheme:dark}
</style>

@media(min-width:781px){.sidecol>section:last-child{position:sticky;top:12px}}
</style>

<body>
<div class="wrap">
  <header class="mast"><div class="brand"><div class="mark" aria-hidden="true">ي</div><div><h1>يومي</h1><div class="sub" id="dt"></div><div class="save-state"><span class="save-dot"></span><span id="saveState">حفظ تلقائي على هذا الجهاز</span></div></div></div><button class="g" data-a="today">اليوم</button></header>
  <section class="card weekcard"><div class="weekhead"><div><h2>أسبوعك</h2><div class="sub">اختار يومًا لعرض خطته ومتابعة إنجازه.</div></div><div class="weeknav"><button class="g" data-a="week" data-i="-1" aria-label="الأسبوع السابق">‹ <span>الأسبوع السابق</span></button><input type="date" id="pickDate" aria-label="اختيار التاريخ"><button class="g" data-a="week" data-i="1" aria-label="الأسبوع التالي"><span>الأسبوع التالي</span> ›</button></div></div><div class="days" id="days"></div></section>
  <div class="board">
    <main class="maincol">
      <section class="card agenda-card"><div class="sectionhead"><div><h2 id="listTitle">خطة اليوم</h2><div class="sub">رتّب وقتك واترك مساحة للراحة.</div></div><button class="g add-activity" data-a="focus">＋ إضافة نشاط</button></div><div class="day-progress-wrap"><div class="daymeta" id="dayProgress"></div></div><div id="list"></div></section>
    </main>
    <aside class="sidecol">
      <section class="card"><h2 class="summarytitle">مساحة يومك</h2><div id="hero"></div></section>
      <section class="card"><h2>توزيع الوقت</h2><div id="sum"></div></section>
      <section class="card"><h2 id="ft">إضافة نشاط</h2><div class="sub" id="editNote" hidden>التعديل أو الحذف هنا يؤثر على نسخة اليوم فقط.</div><div class="chips" id="chips"></div><div class="fg"><input type="text" id="bn" placeholder="اسم النشاط" aria-label="اسم النشاط"><label>من<input type="time" id="bt" value="09:00"></label><label>إلى<input type="time" id="be" value="10:00"></label></div><div class="repeat"><div class="sub" style="margin-bottom:7px">كرر النشاط أسبوعيًا في الأيام اللي تختارها</div><div class="chips" id="repeatDays"></div><div class="sub" style="margin-top:6px">اترك الأيام فارغة لو النشاط لمرة واحدة.</div></div><div class="act"><button id="sv" data-a="ab">إضافة النشاط</button><button class="g" id="cx" data-a="cx" hidden>إلغاء</button></div><div class="err" id="er" role="alert"></div></section>
    </aside>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const id=()=>Math.random().toString(36).slice(2,9);
const PAL=['#6366f1','#0f766e','#d97706','#db2777','#2563eb','#65a30d','#7c3aed','#dc2626'];
const memberKey=new URLSearchParams(location.search).get('member')||'guest',storageKey='yawmi2:'+memberKey;
let S={cats:[{k:'s',n:'نوم',c:PAL[0]},{k:'w',n:'شغل / كلية',c:PAL[1]},{k:'o',n:'نشاطات أخرى',c:PAL[2]}],blocks:{}};
try{let r=localStorage.getItem(storageKey);if(!r){r=localStorage.getItem('yawmi2');if(r){localStorage.setItem(storageKey,r);localStorage.removeItem('yawmi2')}}if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(S));const state=$('#saveState'),wrap=state?.parentElement;if(state)state.textContent='محفوظ تلقائيًا على هذا الجهاز';wrap?.classList.remove('error');return true}catch(e){const state=$('#saveState'),wrap=state?.parentElement;if(state)state.textContent='تعذر الحفظ — مساحة التخزين ممتلئة';wrap?.classList.add('error');return false}};
let T=key(), chosenDate=new Date();
S.blocks[T]=S.blocks[T]||[];
const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const dateKey=d=>key(d);
function drawDays(){const d=new Date(chosenDate);d.setDate(d.getDate()-d.getDay());$('#days').innerHTML=Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);const k=key(x),tasks=S.blocks[k]||[],done=tasks.filter(b=>b.d).length;return `<button class="day${k===T?' on':''}${k===key()?' today':''}" data-a="date" data-i="${k}" aria-pressed="${k===T}"><strong>${dayNames[i]}</strong><small>${x.getDate()} ${x.toLocaleDateString('ar-EG',{month:'short'})}</small>${tasks.length?`<span class="count">${done}/${tasks.length} مهام</span>`:''}</button>`}).join('');$('#pickDate').value=T;const today=T===key();$('#dt').textContent=new Date(T+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});$('#listTitle').textContent=today?'خطة اليوم':'خطة '+dayNames[new Date(T+'T12:00:00').getDay()];}
function getRepeat(){return [...document.querySelectorAll('#repeatDays input:checked')].map(x=>+x.value)}
function setRepeat(values=[]){$('#repeatDays').innerHTML=dayNames.map((n,i)=>`<label><input type="checkbox" value="${i}" ${values.includes(i)?'checked':''}>${n.slice(0,3)}</label>`).join('')}
function addWeekly(item,days){const start=new Date(chosenDate),series=id();for(let n=0;n<370;n++){const d=new Date(start);d.setDate(start.getDate()+n);if(days.includes(d.getDay())){const k=key(d);S.blocks[k]=S.blocks[k]||[];S.blocks[k].push({...item,id:id(),series,d:0})}}}
const hm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const mins=t=>{const a=t.split(':');return (+a[0])*60+(+a[1])};
Object.values(S.blocks).forEach(a=>a.forEach(b=>{if(!b.end)b.end=hm(mins(b.time)+(b.h||1)*60)}));
const dm=b=>{let d=mins(b.end)-mins(b.time);if(d<=0)d+=1440;return d};
const fh=m=>{const h=Math.floor(m/60),r=m%60;return ((h?h+' س':'')+(h&&r?' ':'')+(r?r+' د':''))||'0'};
const cat=k=>S.cats.find(c=>c.k===k)||{n:'—',c:'#94a3b8'};
const segs=b=>{const s=mins(b.time),d=dm(b);return s+d>1440?[[s,1440-s],[0,s+d-1440]]:[[s,d]]};
const ovl=(a,b)=>{const sa=mins(a.time),da=dm(a),sb=mins(b.time),db=dm(b);return [-1440,0,1440].some(o=>sa<sb+o+db&&sb+o<sa+da)};
try{$('#dt').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}catch(e){}
let sel=S.cats[0].k,editId=null,addingCat=false;

function main(){
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const bl=[...S.blocks[T]].sort((a,b)=>mins(a.time)-mins(b.time));
  const tot=bl.reduce((a,b)=>a+dm(b),0),free=Math.max(0,1440-tot);
  const done=bl.filter(b=>b.d).length,pct=bl.length?Math.round(done/bl.length*100):0,today=T===key();
  $('#dayProgress').innerHTML=bl.length?`<b>${done} من ${bl.length}</b><span>${pct}% مكتمل</span><span class="day-progress-track"><i style="width:${pct}%"></i></span>`:`<span>أضف نشاطك الأول وخطط يومك</span>`;
  let cur=null,rem=0,nxt=null,nd=1e9;
  bl.forEach(b=>{const o=(nm-mins(b.time)+1440)%1440,d=dm(b);if(today&&o<d&&!cur){cur=b;rem=d-o}const w=(mins(b.time)-nm+1440)%1440;if(today&&w>0&&w<nd){nd=w;nxt=b}});
  const C=2*Math.PI*86;
  const arcs=bl.map(b=>segs(b).map(x=>`<circle cx="130" cy="130" r="86" fill="none" stroke="${cat(b.c).c}" stroke-width="24" stroke-dasharray="${x[1]/1440*C} ${C}" stroke-dashoffset="${-x[0]/1440*C}" transform="rotate(-90 130 130)"/>`).join('')).join('');
  const an=nm/1440*2*Math.PI-Math.PI/2,px=130+86*Math.cos(an),py=130+86*Math.sin(an);
  const info=cur?`دلوقتي: <b>${esc(cur.t)}</b> · باقي ${fh(rem)}`:nxt?`التالي: <b>${esc(nxt.t)}</b> الساعة <bdi>${nxt.time}</bdi>`:today?'يومك مفتوح — ابدأ بأهم حاجة':'اليوم فاضي لسه';
  $('#hero').innerHTML=`<svg viewBox="0 0 260 260" role="img" aria-label="توزيع وقت اليوم">
    <circle cx="130" cy="130" r="86" fill="none" style="stroke:var(--ac2)" stroke-width="24"/>${arcs}
    <circle cx="${px}" cy="${py}" r="8" style="fill:var(--card);stroke:var(--tx)" stroke-width="3"/>
    <text class="lb" x="130" y="16" text-anchor="middle">12 ص</text><text class="lb" x="246" y="134" text-anchor="middle">6 ص</text>
    <text class="lb" x="130" y="252" text-anchor="middle">12 ظ</text><text class="lb" x="14" y="134" text-anchor="middle">6 م</text>
    <text class="cen" x="130" y="128" text-anchor="middle">${fh(free)}</text><text class="cl" x="130" y="148" text-anchor="middle">وقت متاح</text></svg>
    <div class="now">${info}</div>`;
  const row=(n,c,m)=>`<div class="sm" style="--c:${c}"><span class="dot"></span><span class="n">${n}</span><span class="bar"><i style="width:${Math.min(100,m/14.4)}%"></i></span><b>${fh(m)}</b></div>`;
  $('#sum').innerHTML=S.cats.map(c=>row(esc(c.n),c.c,bl.filter(b=>b.c===c.k).reduce((a,b)=>a+dm(b),0))).join('')+row('فاضي','#94a3b8',free)+(tot>1440?`<div class="warn">الأنشطة زادت عن 24 ساعة، راجع التداخل</div>`:'');
  drawDays();
  const prev=Object.keys(S.blocks).filter(k=>k<T&&S.blocks[k].length).sort().pop();
  $('#list').innerHTML=bl.length?bl.map(b=>{
    const c=cat(b.c),ov=bl.some(o=>o!==b&&ovl(b,o));
    return `<div class="it${b.d?' dn':''}${b===cur?' cur':''}" style="--c:${c.c}"><input type="checkbox" ${b.d?'checked':''} data-a="kb" data-i="${b.id}" aria-label="تم">
      <div class="m"><div class="tt">${esc(b.t)}</div><div class="s"><bdi>${b.time}</bdi> ← <bdi>${b.end}</bdi> · ${fh(dm(b))} · ${esc(c.n)}</div></div>
      ${b.series?'<span class="badge">متكرر</span>':''}${b===cur?'<span class="badge">الآن</span>':''}${ov?'<span class="badge w">تداخل</span>':''}
      <button class="ic" data-a="eb" data-i="${b.id}" aria-label="تعديل">✎</button><button class="ic" data-a="db" data-i="${b.id}" aria-label="حذف">✕</button></div>`}).join('')
    :`<div class="emp"><strong>لسه مفيش حاجة في الجدول</strong>ابدأ بمهمة واحدة، وسيب الباقي يتكوّن براحتك.<div><button data-a="focus">+ أضف أول نشاط</button></div>${prev?`<div style="margin-top:10px"><button class="g" data-a="cp" data-i="${prev}">انسخ جدول آخر يوم</button></div>`:''}</div>`;
}
function chips(){
  $('#chips').innerHTML=S.cats.map(c=>`<button class="chip${c.k===sel?' on':''}" style="--c:${c.c}" data-a="sc" data-i="${c.k}">${esc(c.n)}</button>`).join('')+
    (addingCat?`<input type="text" id="nc" placeholder="اسم القسم" style="width:130px"><button class="g" data-a="sa">حفظ</button>`:`<button class="chip add" data-a="na">+ قسم</button>`);
  const n=$('#nc');if(n)n.focus();
}
function form(){$('#ft').textContent=editId?'تعديل النشاط':'إضافة نشاط';$('#sv').textContent=editId?'حفظ التعديل':'إضافة النشاط';$('#cx').hidden=!editId;$('#editNote').hidden=!editId}
const err=m=>{$('#er').textContent=m||''};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=b.dataset.i,L=S.blocks[T];
  if(a==='date'){chosenDate=new Date(i+'T12:00:00');T=i;S.blocks[T]=S.blocks[T]||[];main();return}
  if(a==='week'){chosenDate.setDate(chosenDate.getDate()+(+i)*7);T=key(chosenDate);S.blocks[T]=S.blocks[T]||[];main();return}
  if(a==='today'){chosenDate=new Date();T=key(chosenDate);S.blocks[T]=S.blocks[T]||[];main();return}
  if(a==='focus'){document.querySelector('#bn').focus();document.querySelector('#bn').scrollIntoView({behavior:'smooth',block:'center'});return}
  if(a==='sc'){sel=i;chips();return}
  if(a==='na'){addingCat=true;chips();return}
  if(a==='sa'){const n=$('#nc').value.trim();if(n){const k='c'+id();S.cats.push({k:k,n:n,c:PAL[S.cats.length%PAL.length]});sel=k}addingCat=false;chips();save();main();return}
  if(a==='ab'){
    const n=$('#bn').value.trim(),s=$('#bt').value,en=$('#be').value;
    if(!n)return err('اكتب اسم النشاط');
    if(!s||!en)return err('حدد البداية والنهاية');
    if(s===en)return err('البداية والنهاية لازم يختلفوا');
    if(editId){const x=L.find(y=>y.id===editId);if(x)Object.assign(x,{c:sel,time:s,end:en,t:n})}
    else {const item={c:sel,time:s,end:en,t:n};const days=getRepeat();if(days.length)addWeekly(item,days);else L.push({id:id(),...item,d:0});}
    editId=null;setRepeat([]);$('#bn').value='';$('#bt').value=en;$('#be').value=hm(mins(en)+60);err('');form();
  }
  if(a==='cx'){editId=null;setRepeat([]);$('#bn').value='';err('');form()}
  if(a==='eb'){const x=L.find(y=>y.id===i);if(x){editId=i;setRepeat([]);sel=x.c;$('#bn').value=x.t;$('#bt').value=x.time;$('#be').value=x.end;err('');form();chips();$('#ft').scrollIntoView({behavior:'smooth'})}return}
  if(a==='kb'){const x=L.find(y=>y.id===i);if(x)x.d=x.d?0:1}
  if(a==='db'){S.blocks[T]=L.filter(y=>y.id!==i);if(editId===i){editId=null;$('#bn').value='';form()}}
  if(a==='cp'){S.blocks[T]=S.blocks[i].map(x=>Object.assign({},x,{id:id(),d:0}))}
  save();main();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(['bn','bt','be'].includes(e.target.id))$('#sv').click();
  if(e.target.id==='nc'){const s=document.querySelector('[data-a="sa"]');if(s)s.click()}
});
setRepeat([]);$('#pickDate').addEventListener('change',e=>{if(e.target.value){T=e.target.value;chosenDate=new Date(T+'T12:00:00');S.blocks[T]=S.blocks[T]||[];main()}});chips();form();main();
setInterval(main,30000);
</script>
</body>
</html>
